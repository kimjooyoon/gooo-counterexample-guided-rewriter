name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Action syntax
        uses: raven-actions/actionlint@v2
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: scripts/semantic-audit.sh
      - name: Immutable release guard contract
        run: scripts/verify-immutable-release.sh --contract
      - name: Verify immutable repository setting
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASE_SETTING_ALLOW_UNAVAILABLE: 'true'
        run: scripts/verify-immutable-release.sh --setting
      - name: Verify merged PR lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-lineage.sh "$GITHUB_REF_NAME"
      - name: Generator, paired evaluation, conformance, and product validation
        run: |
          out="${RUNNER_TEMP}/gooo-counterexample-guided-rewriter-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          scripts/conformance.sh "$out"
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterexample-guided-rewriter-release-conformance-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-counterexample-guided-rewriter-${{ github.run_id }}/
      - name: Build release assets
        run: |
          asset="${RUNNER_TEMP}/gooo-counterexample-guided-rewriter-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="gooo-counterexample-guided-rewriter-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" > "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_SHA=$asset.sha256" >> "$GITHUB_ENV"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET" "$RELEASE_ASSET_SHA" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Verify immutable release API state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-immutable-release.sh --release "$GITHUB_REF_NAME"
