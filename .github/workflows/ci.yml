name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Action syntax
        uses: raven-actions/actionlint@v2
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Semantic audit
        run: scripts/semantic-audit.sh
      - name: Immutable release guard contract
        run: scripts/verify-immutable-release.sh --contract
      - name: Generator, paired evaluation, conformance, and product validation
        run: |
          out="${RUNNER_TEMP}/gooo-counterexample-guided-rewriter-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          scripts/conformance.sh "$out"
      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterexample-guided-rewriter-conformance-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-counterexample-guided-rewriter-${{ github.run_id }}/
